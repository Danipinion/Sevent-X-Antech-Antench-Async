openapi: 3.0.3
info:
  title: TANDUR API
  version: 1.0.0
  description: >
    Spesifikasi REST API TANDUR sebagai kontrak komunikasi antara Frontend dan Backend.
    Mendukung operasional rantai pasok komoditas pertanian, agregasi stok petani,
    dan mekanisme kontrol margin harga.
servers:
  - url: http://localhost:8080/api/v1
    description: Development Server Local
  - url: /api/v1
    description: Traefik Proxy Path
tags:
  - name: "Autentikasi & Pengguna"
    description: "Endpoint registrasi akun, autentikasi login (No HP / NIK), informasi sesi pengguna (/auth/me), dan pencabutan sesi (logout)."
  - name: "Pantauan Harga & Komoditas"
    description: "Katalog komoditas pangan, pantauan harga pasar riil (dashboard realtime update 10 menit), panduan batas margin harga jual, dan acuan harga SP2KP Kemendag."
  - name: "Verifikasi Kemitraan Petani"
    description: "Pemeriksaan status verifikasi identitas petani dan pengajuan dokumen e-KTP terenkripsi AES-256-GCM ke Garage S3 untuk membuka kuota jual panen."
  - name: "Penjualan Panen Petani"
    description: "Manajemen listing hasil panen milik petani yang siap ditransaksikan ke pembeli/tengkulak, diproteksi guard verifikasi kemitraan."
  - name: "Sistem & Pemantauan"
    description: "Pemeriksaan kesehatan sistem (healthcheck), konektivitas database PostgreSQL + PostGIS, dan cache Redis."
paths:
  /health:
    get:
      tags:
        - "Sistem & Pemantauan"
      summary: Healthcheck Status Server
      description: Memeriksa ketersediaan API backend dan koneksi database.
      responses:
        "200":
          description: Server beroperasi normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Server beroperasi normal
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                        example: tandur-api
                      version:
                        type: string
                        example: v1.0.0
                      database:
                        type: string
                        example: connected
                      timestamp:
                        type: string
                        example: "2026-11-21T09:30:00Z"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
  /commodities:
    get:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Daftar Seluruh Komoditas
      description: Mengambil daftar komoditas pertanian beserta acuan harga dasar dan harga pasar.
      responses:
        "200":
          description: Berhasil mengambil daftar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Daftar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: "./schemas/commodity.yaml#/Commodity"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
  /commodities/realtime-prices:
    get:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Pantauan Harga Pasar Riil Komoditas (Dashboard Petani)
      description: >
        Mengambil pantauan harga pasar riil komoditas pertanian (Gabah Kering Panen, GKG, Jagung Pipil, Kedelai Lokal)
        yang diperbarui setiap 10 menit sekali dengan perhitungan selisih/delta harian (Hari ini vs Kemarin).
      parameters:
        - name: kode_provinsi
          in: query
          description: Kode BPS Provinsi (contoh 35 untuk Jawa Timur).
          required: false
          schema:
            type: string
            example: "35"
        - name: kode_kab_kota
          in: query
          description: Kode BPS Kabupaten/Kota (contoh 3519 untuk Kabupaten Madiun).
          required: false
          schema:
            type: string
            example: "3519"
      responses:
        "200":
          description: Berhasil mengambil pantauan harga pasar riil komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Pantauan harga pasar riil komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: "./schemas/commodity.yaml#/DashboardCommodityPrice"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
  /commodities/price-guide:
    get:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Panduan Batas Margin Harga Jual Panen
      description: >
        Mengambil rekomendasi batas harga jual terendah dan tertinggi (toleransi ±15%)
        berdasarkan harga pasar riil untuk komoditas tertentu.
      parameters:
        - name: commodity_name
          in: query
          description: Nama komoditas (contoh "Cabai Merah Keriting", "Gabah Kering Panen")
          required: true
          schema:
            type: string
            example: "Gabah Kering Panen"
        - name: kode_provinsi
          in: query
          description: Kode BPS Provinsi
          required: false
          schema:
            type: string
            example: "35"
        - name: kode_kab_kota
          in: query
          description: Kode BPS Kabupaten/Kota
          required: false
          schema:
            type: string
            example: "3519"
      responses:
        "200":
          description: Panduan batas rentang harga berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Panduan rentang harga komoditas berhasil diambil
                  data:
                    $ref: "./schemas/commodity.yaml#/PriceGuide"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
  /commodities/market-prices:
    get:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Harga Pasar Komoditas Terbaru (SP2KP Kemendag)
      description: >
        Mengambil data perbandingan harga komoditas pangan dan pertanian dari SP2KP Kemendag RI
        secara nasional atau spesifik wilayah BPS (berdasarkan kode provinsi dan kode kabupaten/kota).
      parameters:
        - name: tanggal
          in: query
          description: Tanggal acuan harga (format YYYY-MM-DD). Default hari ini / hari kerja terakhir.
          required: false
          schema:
            type: string
            example: "2026-11-20"
        - name: tanggal_pembanding
          in: query
          description: Tanggal pembanding untuk menghitung selisih harga (format YYYY-MM-DD). Default H-1.
          required: false
          schema:
            type: string
            example: "2026-11-19"
        - name: kode_provinsi
          in: query
          description: Kode BPS Provinsi (contoh 35 untuk Jawa Timur). Kosongkan untuk harga nasional.
          required: false
          schema:
            type: string
            example: "35"
        - name: kode_kab_kota
          in: query
          description: Kode BPS Kabupaten/Kota (contoh 3519 untuk Kabupaten Madiun).
          required: false
          schema:
            type: string
            example: "3519"
      responses:
        "200":
          description: Berhasil mengambil data harga pasar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Harga pasar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: "./schemas/commodity.yaml#/SP2KPCommodityPrice"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "500":
          description: Gagal mengambil data harga pasar SP2KP Kemendag
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
    post:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Query Harga Pasar Komoditas (SP2KP Kemendag)
      description: Mengambil data perbandingan harga komoditas melalui JSON payload body atau Form parameters.
      parameters:
        - name: tanggal
          in: query
          description: Tanggal acuan harga (opsional lewat query)
          required: false
          schema:
            type: string
            example: "2026-11-20"
        - name: tanggal_pembanding
          in: query
          description: Tanggal pembanding (opsional lewat query)
          required: false
          schema:
            type: string
            example: "2026-11-19"
        - name: kode_provinsi
          in: query
          description: Kode BPS Provinsi (opsional lewat query)
          required: false
          schema:
            type: string
            example: "35"
        - name: kode_kab_kota
          in: query
          description: Kode BPS Kabupaten/Kota (opsional lewat query)
          required: false
          schema:
            type: string
            example: "3519"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal:
                  type: string
                  example: "2026-11-20"
                tanggal_pembanding:
                  type: string
                  example: "2026-11-19"
                kode_provinsi:
                  type: string
                  example: "35"
                kode_kab_kota:
                  type: string
                  example: "3519"
      responses:
        "200":
          description: Berhasil mengambil data harga pasar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Harga pasar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: "./schemas/commodity.yaml#/SP2KPCommodityPrice"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "500":
          description: Gagal mengambil data harga pasar SP2KP Kemendag
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /commodities/{id}:
    get:
      tags:
        - "Pantauan Harga & Komoditas"
      summary: Detail Komoditas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail komoditas ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Detail komoditas berhasil diambil
                  data:
                    $ref: "./schemas/commodity.yaml#/Commodity"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "404":
          description: Komoditas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/register:
    post:
      tags:
        - "Autentikasi & Pengguna"
      summary: Registrasi Akun Pengguna Baru
      description: >
        Mendaftarkan akun baru (farmer, middleman, atau buyer) beserta informasi lokasi opsional.
        Anda dapat mengisi langsung melalui Form Input di bagian **Parameters** di bawah ini,
        atau memilih contoh JSON melalui **Request body**.
      parameters:
        - name: name
          in: query
          description: Nama lengkap pengguna (Wajib)
          required: false
          schema:
            type: string
            example: "Pak Joko Tani"
        - name: phone
          in: query
          description: Nomor Handphone 10-13 digit (Wajib)
          required: false
          schema:
            type: string
            example: "081234567890"
        - name: password
          in: query
          description: Password minimal 6 karakter (Wajib)
          required: false
          schema:
            type: string
            format: password
            example: "rahasia123"
        - name: role
          in: query
          description: Peran akun dalam sistem (Wajib)
          required: false
          schema:
            type: string
            enum: [farmer, middleman, buyer]
            example: "farmer"
        - name: nik
          in: query
          description: NIK KTP 16 digit angka (Opsional)
          required: false
          schema:
            type: string
            example: "3201010101010077"
        - name: is_bisnis
          in: query
          description: Apakah akun bisnis / perusahaan
          required: false
          schema:
            type: boolean
            default: false
            example: false
        - name: address
          in: query
          description: Alamat lokasi kebun / gudang / toko (Opsional)
          required: false
          schema:
            type: string
            example: "Jl. Pertanian Makmur No. 20"
        - name: latitude
          in: query
          description: Titik koordinat Latitude (Opsional)
          required: false
          schema:
            type: number
            format: double
            example: -6.7456
        - name: longitude
          in: query
          description: Titik koordinat Longitude (Opsional)
          required: false
          schema:
            type: number
            format: double
            example: 107.0872
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/RegisterRequest"
            examples:
              petani_lengkap:
                summary: "🧑‍🌾 1. Petani (Lengkap dengan Koordinat Kebun)"
                value:
                  nik: "3201010101010099"
                  name: "Pak Slamet Petani"
                  phone: "081399998888"
                  password: "secretPassword123"
                  role: "farmer"
                  is_bisnis: false
                  location:
                    label: "Kebun Cabai Utama"
                    address: "Jl. Raya Pertanian No. 12"
                    village: "Cikanyere"
                    district: "Sukaresmi"
                    city: "Kabupaten Cianjur"
                    province: "Jawa Barat"
                    latitude: -6.7456
                    longitude: 107.0872
              tengkulak_bisnis:
                summary: "🏢 2. Tengkulak (Akun Bisnis + Gudang)"
                value:
                  nik: "3201010101010088"
                  name: "CV Tani Berkah Bersama"
                  phone: "081288887777"
                  password: "secretPassword123"
                  role: "middleman"
                  is_bisnis: true
                  location:
                    label: "Gudang Konsolidasi"
                    address: "Jl. Pergudangan Agrobisnis No. 8"
                    village: "Sukamaju"
                    district: "Cianjur"
                    city: "Kabupaten Cianjur"
                    province: "Jawa Barat"
                    latitude: -6.8173
                    longitude: 107.1394
              pembeli_individu:
                summary: "🛒 3. Pembeli (Simple tanpa Lokasi)"
                value:
                  name: "Resto Padang Sejahtera"
                  phone: "081177776666"
                  password: "secretPassword123"
                  role: "buyer"
                  is_bisnis: false
      responses:
        "201":
          description: Berhasil mendaftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Registrasi akun berhasil
                  data:
                    $ref: "./schemas/user.yaml#/User"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "400":
          description: Data masukan tidak valid
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "409":
          description: Nomor handphone atau NIK sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/login:
    post:
      tags:
        - "Autentikasi & Pengguna"
      summary: Login Pengguna
      description: >
        Autentikasi pengguna menggunakan Nomor Handphone atau NIK sebagai username dan password.
        Mengembalikan token sesi berbasis JWT (JSON Web Token) yang digunakan untuk otorisasi endpoint terlindungi.
        Anda dapat mengisi langsung melalui Form Input di bagian **Parameters** di bawah ini,
        atau mengirim JSON payload melalui **Request body**.
      parameters:
        - name: username
          in: query
          description: Nomor Handphone (10-13 digit) atau NIK (16 digit angka)
          required: false
          schema:
            type: string
            example: "081399998888"
        - name: password
          in: query
          description: Password akun pengguna
          required: false
          schema:
            type: string
            format: password
            example: "secretPassword123"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/LoginRequest"
            examples:
              login_phone:
                summary: "📱 1. Login menggunakan Nomor Handphone"
                value:
                  username: "081399998888"
                  password: "secretPassword123"
              login_nik:
                summary: "🪪 2. Login menggunakan NIK KTP"
                value:
                  username: "3201010101010099"
                  password: "secretPassword123"
      responses:
        "200":
          description: Login berhasil, token JWT diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    $ref: "./schemas/user.yaml#/LoginResponseData"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "400":
          description: Username atau password tidak diisi
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "401":
          description: Kredensial tidak valid (Nomor HP/NIK atau password salah)
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "403":
          description: Akun tidak aktif atau dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/me:
    get:
      tags:
        - "Autentikasi & Pengguna"
      summary: Profil Pengguna Aktif (Sesi JWT)
      description: Mengambil data profil pengguna yang saat ini sedang login berdasarkan token JWT di header Authorization.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profil pengguna berhasil diambil
                  data:
                    $ref: "./schemas/user.yaml#/User"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "401":
          description: Token otorisasi tidak valid atau telah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/logout:
    post:
      tags:
        - "Autentikasi & Pengguna"
      summary: Logout Pengguna
      description: >
        Mengakhiri sesi pengguna aktif dan memasukkan token JWT ke dalam daftar hitam (blacklist)
        sehingga token tersebut tidak dapat digunakan lagi untuk otorisasi.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logout berhasil
                  data:
                    nullable: true
                    example: null
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "401":
          description: Token otorisasi tidak valid, telah kedaluwarsa, atau sudah dibatalkan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /farmer/verification:
    get:
      tags:
        - "Verifikasi Kemitraan Petani"
      summary: Status Verifikasi Kemitraan Petani
      description: Memeriksa status verifikasi identitas e-KTP petani, hasil pembacaan OCR, dan hak jual panen.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status verifikasi petani berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Status verifikasi kemitraan petani
                  data:
                    $ref: "./schemas/user.yaml#/FarmerVerificationResponse"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "401":
          description: Belum terautentikasi
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
    post:
      tags:
        - "Verifikasi Kemitraan Petani"
      summary: Kirim Dokumen Verifikasi e-KTP Petani
      description: Mengunggah berkas foto e-KTP asli dan data kependudukan hasil pembacaan OCR untuk mengaktifkan status kemitraan resmi dan membuka kuota jual panen.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/FarmerVerificationInput"
          multipart/form-data:
            schema:
              $ref: "./schemas/user.yaml#/FarmerVerificationInput"
      responses:
        "200":
          description: Dokumen e-KTP berhasil diverifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Dokumen e-KTP berhasil diverifikasi. Kemitraan resmi aktif dan Anda dapat mulai menjual hasil panen.
                  data:
                    $ref: "./schemas/user.yaml#/FarmerVerificationResponse"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "400":
          description: Validasi gagal (NIK tidak valid, foto KTP kosong, atau pernyataan belum disetujui)
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "403":
          description: Hanya akun dengan role petani yang dapat melakukan verifikasi kemitraan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "409":
          description: NIK sudah digunakan oleh akun lain
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /farmer/listings:
    get:
      tags:
        - "Penjualan Panen Petani"
      summary: Daftar Hasil Panen Petani
      description: Mengambil seluruh daftar hasil panen yang didaftarkan oleh petani yang sedang login.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar panen berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: "./schemas/user.yaml#/FarmerListing"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
    post:
      tags:
        - "Penjualan Panen Petani"
      summary: Jual Hasil Panen (Daftarkan Listing Panen)
      description: Mendaftarkan komoditas panen untuk dijual. Petani WAJIB berstatus terverifikasi (e-KTP diverifikasi) untuk dapat menggunakan fitur ini.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/CreateListingInput"
      responses:
        "201":
          description: Hasil panen berhasil didaftarkan untuk dijual
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "./schemas/user.yaml#/FarmerListing"
                  meta:
                    $ref: "./schemas/error.yaml#/Meta"
        "403":
          description: Petani belum terverifikasi (FARMER_NOT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint /auth/login
