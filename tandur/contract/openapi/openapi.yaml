openapi: 3.0.3
info:
  title: TANDUR API
  version: 1.0.0
  description: >
    Spesifikasi REST API TANDUR sebagai kontrak komunikasi antara Frontend dan Backend.
    Mendukung operasional rantai pasok komoditas pertanian, agregasi stok petani,
    dan mekanisme kontrol margin harga.
servers:
  - url: http://localhost:8080/api/v1
    description: Development Server Local
  - url: /api/v1
    description: Traefik Proxy Path
paths:
  /health:
    get:
      summary: Healthcheck Status Server
      description: Memeriksa ketersediaan API backend dan koneksi database.
      responses:
        "200":
          description: Server beroperasi normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
                    example: TANDUR Backend API
                  version:
                    type: string
                    example: v1.0.0
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    example: "2026-11-15T15:30:00Z"
  /commodities:
    get:
      summary: Daftar Seluruh Komoditas
      description: Mengambil daftar komoditas pertanian beserta acuan harga dasar dan harga pasar.
      responses:
        "200":
          description: Berhasil mengambil daftar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "./schemas/commodity.yaml#/Commodity"
  /commodities/{id}:
    get:
      summary: Detail Komoditas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail komoditas ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "./schemas/commodity.yaml#/Commodity"
        "404":
          description: Komoditas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/register:
    post:
      summary: Registrasi Akun Pengguna Baru
      description: >
        Mendaftarkan akun baru (farmer, middleman, atau buyer) beserta informasi lokasi opsional.
        Anda dapat mengisi langsung melalui Form Input di bagian **Parameters** di bawah ini,
        atau memilih contoh JSON melalui **Request body**.
      parameters:
        - name: name
          in: query
          description: Nama lengkap pengguna (Wajib)
          required: false
          schema:
            type: string
            example: "Pak Joko Tani"
        - name: phone
          in: query
          description: Nomor Handphone 10-13 digit (Wajib)
          required: false
          schema:
            type: string
            example: "081234567890"
        - name: password
          in: query
          description: Password minimal 6 karakter (Wajib)
          required: false
          schema:
            type: string
            format: password
            example: "rahasia123"
        - name: role
          in: query
          description: Peran akun dalam sistem (Wajib)
          required: false
          schema:
            type: string
            enum: [farmer, middleman, buyer]
            example: "farmer"
        - name: nik
          in: query
          description: NIK KTP 16 digit angka (Opsional)
          required: false
          schema:
            type: string
            example: "3201010101010077"
        - name: is_bisnis
          in: query
          description: Apakah akun bisnis / perusahaan
          required: false
          schema:
            type: boolean
            default: false
            example: false
        - name: address
          in: query
          description: Alamat lokasi kebun / gudang / toko (Opsional)
          required: false
          schema:
            type: string
            example: "Jl. Pertanian Makmur No. 20"
        - name: latitude
          in: query
          description: Titik koordinat Latitude (Opsional)
          required: false
          schema:
            type: number
            format: double
            example: -6.7456
        - name: longitude
          in: query
          description: Titik koordinat Longitude (Opsional)
          required: false
          schema:
            type: number
            format: double
            example: 107.0872
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/RegisterRequest"
            examples:
              petani_lengkap:
                summary: "🧑‍🌾 1. Petani (Lengkap dengan Koordinat Kebun)"
                value:
                  nik: "3201010101010099"
                  name: "Pak Slamet Petani"
                  phone: "081399998888"
                  password: "secretPassword123"
                  role: "farmer"
                  is_bisnis: false
                  location:
                    label: "Kebun Cabai Utama"
                    address: "Jl. Raya Pertanian No. 12"
                    village: "Cikanyere"
                    district: "Sukaresmi"
                    city: "Kabupaten Cianjur"
                    province: "Jawa Barat"
                    latitude: -6.7456
                    longitude: 107.0872
              tengkulak_bisnis:
                summary: "🏢 2. Tengkulak (Akun Bisnis + Gudang)"
                value:
                  nik: "3201010101010088"
                  name: "CV Tani Berkah Bersama"
                  phone: "081288887777"
                  password: "secretPassword123"
                  role: "middleman"
                  is_bisnis: true
                  location:
                    label: "Gudang Konsolidasi"
                    address: "Jl. Pergudangan Agrobisnis No. 8"
                    village: "Sukamaju"
                    district: "Cianjur"
                    city: "Kabupaten Cianjur"
                    province: "Jawa Barat"
                    latitude: -6.8173
                    longitude: 107.1394
              pembeli_individu:
                summary: "🛒 3. Pembeli (Simple tanpa Lokasi)"
                value:
                  name: "Resto Padang Sejahtera"
                  phone: "081177776666"
                  password: "secretPassword123"
                  role: "buyer"
                  is_bisnis: false
      responses:
        "201":
          description: Berhasil mendaftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Registrasi akun berhasil
                  data:
                    $ref: "./schemas/user.yaml#/User"
        "400":
          description: Data masukan tidak valid
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "409":
          description: Nomor handphone atau NIK sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/login:
    post:
      summary: Login Pengguna
      description: >
        Autentikasi pengguna menggunakan Nomor Handphone atau NIK sebagai username dan password.
        Mengembalikan token sesi berbasis JWT (JSON Web Token) yang digunakan untuk otorisasi endpoint terlindungi.
        Anda dapat mengisi langsung melalui Form Input di bagian **Parameters** di bawah ini,
        atau mengirim JSON payload melalui **Request body**.
      parameters:
        - name: username
          in: query
          description: Nomor Handphone (10-13 digit) atau NIK (16 digit angka)
          required: false
          schema:
            type: string
            example: "081399998888"
        - name: password
          in: query
          description: Password akun pengguna
          required: false
          schema:
            type: string
            format: password
            example: "secretPassword123"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/user.yaml#/LoginRequest"
            examples:
              login_phone:
                summary: "📱 1. Login menggunakan Nomor Handphone"
                value:
                  username: "081399998888"
                  password: "secretPassword123"
              login_nik:
                summary: "🪪 2. Login menggunakan NIK KTP"
                value:
                  username: "3201010101010099"
                  password: "secretPassword123"
      responses:
        "200":
          description: Login berhasil, token JWT diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    $ref: "./schemas/user.yaml#/LoginResponseData"
        "400":
          description: Username atau password tidak diisi
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "401":
          description: Kredensial tidak valid (Nomor HP/NIK atau password salah)
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "403":
          description: Akun tidak aktif atau dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
  /auth/me:
    get:
      summary: Profil Pengguna Aktif (Sesi JWT)
      description: Mengambil data profil pengguna yang saat ini sedang login berdasarkan token JWT di header Authorization.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profil pengguna berhasil diambil
                  data:
                    $ref: "./schemas/user.yaml#/User"
        "401":
          description: Token otorisasi tidak valid atau telah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"
        "404":
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "./schemas/error.yaml#/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT yang diperoleh dari endpoint /auth/login
