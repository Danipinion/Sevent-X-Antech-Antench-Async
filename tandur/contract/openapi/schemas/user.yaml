CreateListingInput:
  type: object
  required:
    - commodity_id
    - title
    - estimated_quantity
    - price_per_unit
    - media_urls
  properties:
    commodity_id:
      type: string
      example: "gabah-kering-panen"
    commodity_name:
      type: string
      example: "Gabah GKP"
    category:
      type: string
      example: "Gabah GKP"
    title:
      type: string
      example: "Gabah GKP Super Siap Panen Kualitas Prima"
    description:
      type: string
      example: "Varietas Inpari 32. Dipanen memakai mesin Combine Harvester, bersih tanpa jerami dan batu."
    estimated_quantity:
      type: number
      description: Estimasi bobot (minimal 500 kg)
      example: 8500
    min_order_quantity:
      type: number
      default: 500
      example: 500
    unit:
      type: string
      default: "kg"
      example: "kg"
    price_per_unit:
      type: number
      description: Harga harapan petani per kilogram
      example: 7300
    ready_date:
      type: string
      description: Tanggal siap timbang dan muat (YYYY-MM-DD)
      example: "2025-02-07"
    estimated_harvest_date:
      type: string
      example: "2025-02-07"
    pickup_address:
      type: string
      description: Titik muat atau lokasi gudang tani
      example: "Sukamaju, Ngawi"
    media_urls:
      type: array
      description: Berkas media (minimal 1 foto, maksimal 1 video, total maksimal 5 berkas)
      items:
        type: string
      example:
        - "http://localhost:3900/tandur/listings/user1/sampel_gabah_bkkk.jpg"
    latitude:
      type: number
      example: -7.4045
    longitude:
      type: number
      example: 111.4452

