User:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    nik:
      type: string
      nullable: true
      maxLength: 16
      example: "3201010101010099"
    name:
      type: string
      maxLength: 150
      example: "Pak Slamet Petani"
    phone:
      type: string
      maxLength: 13
      example: "081399998888"
    role:
      type: string
      enum: [farmer, middleman, buyer]
      example: "farmer"
    is_bisnis:
      type: boolean
      default: false
      example: false
    is_active:
      type: boolean
      default: true
      example: true
    is_verified:
      type: boolean
      default: false
      example: true
    verification_status:
      type: string
      enum: [unverified, pending, verified, rejected]
      example: "verified"
    can_sell_harvest:
      type: boolean
      example: true
    avatar_url:
      type: string
      nullable: true
      example: "https://storage.tandur.com/avatars/user-avatar.jpg"
    ktp_photo_url:
      type: string
      nullable: true
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    birth_place:
      type: string
      nullable: true
      example: "Demak"
    birth_date:
      type: string
      nullable: true
      example: "1978-05-14"
    ktp_address:
      type: string
      nullable: true
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    verified_at:
      type: string
      format: date-time
      nullable: true
      example: "2026-11-21T07:30:00Z"
    rejection_reason:
      type: string
      nullable: true
      example: null
    created_at:
      type: string
      format: date-time
      example: "2026-11-19T18:10:18Z"
    updated_at:
      type: string
      format: date-time
      example: "2026-11-19T18:10:18Z"
    location:
      $ref: "#/components/schemas/UserLocation"

UserLocation:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "562e7d5c-d1af-42d6-b64d-858c49e28b8d"
    user_id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    label:
      type: string
      example: "Kebun Cabai Utama"
    address:
      type: string
      example: "Jl. Raya Pertanian No. 12"
    village:
      type: string
      example: "Cikanyere"
    district:
      type: string
      example: "Sukaresmi"
    city:
      type: string
      example: "Kabupaten Cianjur"
    province:
      type: string
      example: "Jawa Barat"
    latitude:
      type: number
      format: double
      example: -6.7456
    longitude:
      type: number
      format: double
      example: 107.0872
    is_primary:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

RegisterRequest:
  type: object
  required:
    - name
    - phone
    - password
    - role
  properties:
    nik:
      type: string
      maxLength: 16
      example: "3201010101010099"
    name:
      type: string
      maxLength: 150
      example: "Pak Slamet Petani"
    phone:
      type: string
      maxLength: 13
      example: "081399998888"
    password:
      type: string
      minLength: 6
      format: password
      example: "secretPassword123"
    role:
      type: string
      enum: [farmer, middleman, buyer]
      example: "farmer"
    is_bisnis:
      type: boolean
      default: false
      example: false
    location:
      type: object
      required:
        - address
        - latitude
        - longitude
      properties:
        label:
          type: string
          example: "Kebun Cabai Utama"
        address:
          type: string
          example: "Jl. Raya Pertanian No. 12"
        village:
          type: string
          example: "Cikanyere"
        district:
          type: string
          example: "Sukaresmi"
        city:
          type: string
          example: "Kabupaten Cianjur"
        province:
          type: string
          example: "Jawa Barat"
        latitude:
          type: number
          format: double
          example: -6.7456
        longitude:
          type: number
          format: double
          example: 107.0872

LoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: Nomor Handphone (10-13 digit) atau NIK (16 digit angka)
      example: "081399998888"
    password:
      type: string
      format: password
      description: Password akun pengguna
      example: "secretPassword123"

LoginResponseData:
  type: object
  properties:
    token:
      type: string
      description: JSON Web Token (JWT) untuk autentikasi sesi
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    token_type:
      type: string
      example: "Bearer"
    expires_at:
      type: string
      format: date-time
      example: "2026-11-23T15:30:00Z"
    user:
      $ref: "#/User"

UpdateProfileRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 150
      description: Nama lengkap pengguna
      example: "Pak Slamet Petani Makmur"
    phone:
      type: string
      maxLength: 13
      description: Nomor Handphone 10-13 digit
      example: "081399998888"
    avatar_url:
      type: string
      description: URL tautan foto profil baru
      example: "https://storage.tandur.com/avatars/new-profile.jpg"
    is_bisnis:
      type: boolean
      description: Status akun bisnis/perorangan
      example: false
    label:
      type: string
      description: Label penamaan lokasi (cth. Kebun Utama, Rumah, Gudang)
      example: "Rumah Utama"
    address:
      type: string
      description: Alamat lengkap lokasi pengguna
      example: "Jl. Pertanian Modern No. 5"
    village:
      type: string
      example: "Cikanyere"
    district:
      type: string
      example: "Sukaresmi"
    city:
      type: string
      example: "Kabupaten Cianjur"
    province:
      type: string
      example: "Jawa Barat"
    latitude:
      type: number
      format: double
      example: -6.7456
    longitude:
      type: number
      format: double
      example: 107.0872

FarmerVerificationInput:
  type: object
  required:
    - nik
    - name
    - ktp_address
    - ktp_photo_url
    - declaration_accepted
  properties:
    nik:
      type: string
      pattern: "^[0-9]{16}$"
      example: "3321041405760002"
    name:
      type: string
      example: "SUGENG RIYADI"
    birth_place:
      type: string
      example: "Demak"
    birth_date:
      type: string
      example: "1978-05-14"
    ktp_address:
      type: string
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    ktp_photo_url:
      type: string
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    declaration_accepted:
      type: boolean
      example: true

FarmerVerificationResponse:
  type: object
  properties:
    user_id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    nik:
      type: string
      example: "3321041405760002"
    name:
      type: string
      example: "SUGENG RIYADI"
    verification_status:
      type: string
      enum: [unverified, pending, verified, rejected]
      example: "verified"
    is_verified:
      type: boolean
      example: true
    can_sell_harvest:
      type: boolean
      example: true
    avatar_url:
      type: string
      nullable: true
      example: "https://storage.tandur.com/avatars/user-avatar.jpg"
    ktp_photo_url:
      type: string
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    birth_place:
      type: string
      example: "Demak"
    birth_date:
      type: string
      example: "1978-05-14"
    ktp_address:
      type: string
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    verified_at:
      type: string
      format: date-time
      example: "2026-11-21T07:30:00Z"
    message:
      type: string
      example: "Dokumen e-KTP berhasil diverifikasi. Kemitraan resmi aktif dan Anda dapat mulai menjual hasil panen."

