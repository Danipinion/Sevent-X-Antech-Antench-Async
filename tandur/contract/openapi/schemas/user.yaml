      type: string
      example: "Sukaresmi"
    city:
      type: string
      example: "Kabupaten Cianjur"
    province:
      type: string
      example: "Jawa Barat"
    latitude:
      type: number
      format: double
      example: -6.7456
    longitude:
      type: number
      format: double
      example: 107.0872

FarmerVerificationInput:
  type: object
  required:
    - nik
    - name
    - ktp_address
    - ktp_photo_url
    - declaration_accepted
  properties:
    nik:
      type: string
      pattern: "^[0-9]{16}$"
      example: "3321041405760002"
    name:
      type: string
      example: "SUGENG RIYADI"
    birth_place:
      type: string
      example: "Demak"
    birth_date:
      type: string
      example: "1978-05-14"
    ktp_address:
      type: string
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    ktp_photo_url:
      type: string
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    declaration_accepted:
      type: boolean
      example: true

