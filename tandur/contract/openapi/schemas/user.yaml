User:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    nik:
      type: string
      nullable: true
      maxLength: 16
      example: "3201010101010099"
    name:
      type: string
      maxLength: 150
      example: "Pak Slamet Petani"
    phone:
      type: string
      maxLength: 13
      example: "081399998888"
    role:
      type: string
      enum: [farmer, middleman, buyer]
      example: "farmer"
    is_bisnis:
      type: boolean
      default: false
      example: false
    is_active:
      type: boolean
      default: true
      example: true
    is_verified:
      type: boolean
      default: false
      example: true
    verification_status:
      type: string
      enum: [unverified, pending, verified, rejected]
      example: "verified"
    can_sell_harvest:
      type: boolean
      example: true
    ktp_photo_url:
      type: string
      nullable: true
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    birth_place:
      type: string
      nullable: true
      example: "Demak"
    birth_date:
      type: string
      nullable: true
      example: "1978-05-14"
    ktp_address:
      type: string
      nullable: true
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    verified_at:
      type: string
      format: date-time
      nullable: true
      example: "2026-11-21T07:30:00Z"
    rejection_reason:
      type: string
      nullable: true
      example: null
    created_at:
      type: string
      format: date-time
      example: "2026-11-19T18:10:18Z"
    updated_at:
      type: string
      format: date-time
      example: "2026-11-19T18:10:18Z"
    location:
      $ref: "#/components/schemas/UserLocation"

UserLocation:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "562e7d5c-d1af-42d6-b64d-858c49e28b8d"
    user_id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    label:
      type: string
      example: "Kebun Cabai Utama"
    address:
      type: string
      example: "Jl. Raya Pertanian No. 12"
    village:
      type: string
      example: "Cikanyere"
    district:
      type: string
      example: "Sukaresmi"
    city:
      type: string
      example: "Kabupaten Cianjur"
    province:
      type: string
      example: "Jawa Barat"
    latitude:
      type: number
      format: double
      example: -6.7456
    longitude:
      type: number
      format: double
      example: 107.0872
    is_primary:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

RegisterRequest:
  type: object
  required:
    - name
    - phone
    - password
    - role
  properties:
    nik:
      type: string
      maxLength: 16
      example: "3201010101010099"
    name:
      type: string
      maxLength: 150
      example: "Pak Slamet Petani"
    phone:
      type: string
      maxLength: 13
      example: "081399998888"
    password:
      type: string
      minLength: 6
      format: password
      example: "secretPassword123"
    role:
      type: string
      enum: [farmer, middleman, buyer]
      example: "farmer"
    is_bisnis:
      type: boolean
      default: false
      example: false
    location:
      type: object
      required:
        - address
        - latitude
        - longitude
      properties:
        label:
          type: string
          example: "Kebun Cabai Utama"
        address:
          type: string
          example: "Jl. Raya Pertanian No. 12"
        village:
          type: string
          example: "Cikanyere"
        district:
          type: string
          example: "Sukaresmi"
        city:
          type: string
          example: "Kabupaten Cianjur"
        province:
          type: string
          example: "Jawa Barat"
        latitude:
          type: number
          format: double
          example: -6.7456
        longitude:
          type: number
          format: double
          example: 107.0872

LoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: Nomor Handphone (10-13 digit) atau NIK (16 digit angka)
      example: "081399998888"
    password:
      type: string
      format: password
      description: Password akun pengguna
      example: "secretPassword123"

LoginResponseData:
  type: object
  properties:
    token:
      type: string
      description: JSON Web Token (JWT) untuk autentikasi sesi
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    token_type:
      type: string
      example: "Bearer"
    expires_at:
      type: string
      format: date-time
      example: "2026-11-23T15:30:00Z"
    user:
      $ref: "#/User"

FarmerVerificationInput:
  type: object
  required:
    - nik
    - name
    - ktp_address
    - ktp_photo_url
    - declaration_accepted
  properties:
    nik:
      type: string
      pattern: "^[0-9]{16}$"
      example: "3321041405760002"
    name:
      type: string
      example: "SUGENG RIYADI"
    birth_place:
      type: string
      example: "Demak"
    birth_date:
      type: string
      example: "1978-05-14"
    ktp_address:
      type: string
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    ktp_photo_url:
      type: string
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    declaration_accepted:
      type: boolean
      example: true

FarmerVerificationResponse:
  type: object
  properties:
    user_id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    nik:
      type: string
      example: "3321041405760002"
    name:
      type: string
      example: "SUGENG RIYADI"
    verification_status:
      type: string
      enum: [unverified, pending, verified, rejected]
      example: "verified"
    is_verified:
      type: boolean
      example: true
    can_sell_harvest:
      type: boolean
      example: true
    ktp_photo_url:
      type: string
      example: "https://storage.tandur.com/ktp/3321041405760002.jpg"
    birth_place:
      type: string
      example: "Demak"
    birth_date:
      type: string
      example: "1978-05-14"
    ktp_address:
      type: string
      example: "RT 03 / RW 02, Desa Karangawen, Kecamatan Karangawen, Kabupaten Demak, Jawa Tengah 59566"
    verified_at:
      type: string
      format: date-time
      example: "2026-11-21T07:30:00Z"
    message:
      type: string
      example: "Dokumen e-KTP berhasil diverifikasi. Kemitraan resmi aktif dan Anda dapat mulai menjual hasil panen."

FarmerListing:
  type: object
  properties:
    id:
      type: string
      example: "9e81b672-0e24-419b-a320-b6f790c68123"
    farmer_id:
      type: string
      format: uuid
      example: "e445499d-4f26-424c-9e70-10ffcc8b2a35"
    commodity_id:
      type: string
      example: "gabah-kering-panen"
    commodity_name:
      type: string
      example: "Gabah GKP"
    category:
      type: string
      example: "Gabah GKP"
    title:
      type: string
      example: "Gabah GKP Super Siap Panen Kualitas Prima"
    description:
      type: string
      example: "Varietas Inpari 32 (Standar Bulir Sedang). Dipanen memakai mesin Combine Harvester, bersih tanpa jerami dan batu."
    estimated_quantity:
      type: number
      example: 8500
    available_quantity:
      type: number
      example: 8500
    min_order_quantity:
      type: number
      example: 500
    unit:
      type: string
      example: "kg"
    price_per_unit:
      type: number
      example: 7300
    estimated_gross_revenue:
      type: number
      example: 62050000
    ready_date:
      type: string
      example: "2025-02-07"
    estimated_harvest_date:
      type: string
      example: "2025-02-07"
    pickup_address:
      type: string
      example: "Sukamaju, Ngawi"
    media_urls:
      type: array
      items:
        type: string
      example:
        - "http://localhost:3900/tandur/listings/user1/sample1.jpg"
        - "http://localhost:3900/tandur/listings/user1/video1.mp4"
    status:
      type: string
      example: "published"
    latitude:
      type: number
      example: -7.4045
    longitude:
      type: number
      example: 111.4452
    created_at:
      type: string
      example: "2026-11-21T07:30:00Z"

CreateListingInput:
  type: object
  required:
    - commodity_id
    - title
    - estimated_quantity
    - price_per_unit
    - media_urls
  properties:
    commodity_id:
      type: string
      example: "gabah-kering-panen"
    commodity_name:
      type: string
      example: "Gabah GKP"
    category:
      type: string
      example: "Gabah GKP"
    title:
      type: string
      example: "Gabah GKP Super Siap Panen Kualitas Prima"
    description:
      type: string
      example: "Varietas Inpari 32. Dipanen memakai mesin Combine Harvester, bersih tanpa jerami dan batu."
    estimated_quantity:
      type: number
      description: Estimasi bobot (minimal 500 kg)
      example: 8500
    min_order_quantity:
      type: number
      default: 500
      example: 500
    unit:
      type: string
      default: "kg"
      example: "kg"
    price_per_unit:
      type: number
      description: Harga harapan petani per kilogram
      example: 7300
    ready_date:
      type: string
      description: Tanggal siap timbang dan muat (YYYY-MM-DD)
      example: "2025-02-07"
    estimated_harvest_date:
      type: string
      example: "2025-02-07"
    pickup_address:
      type: string
      description: Titik muat atau lokasi gudang tani
      example: "Sukamaju, Ngawi"
    media_urls:
      type: array
      description: Berkas media (minimal 1 foto, maksimal 1 video, total maksimal 5 berkas)
      items:
        type: string
      example:
        - "http://localhost:3900/tandur/listings/user1/sampel_gabah_bkkk.jpg"
    latitude:
      type: number
      example: -7.4045
    longitude:
      type: number
      example: 111.4452

UpdateListingInput:
  type: object
  properties:
    commodity_id:
      type: string
      example: "gabah-kering-panen"
    commodity_name:
      type: string
      example: "Gabah GKP"
    category:
      type: string
      example: "Gabah GKP"
    title:
      type: string
      example: "Gabah GKP Super Siap Panen Update"
    description:
      type: string
      example: "Varietas Inpari 32 kadar air 21% bersih"
    estimated_quantity:
      type: number
      example: 9000
    min_order_quantity:
      type: number
      example: 500
    price_per_unit:
      type: number
      example: 7350
    ready_date:
      type: string
      example: "2025-02-08"
    pickup_address:
      type: string
      example: "Sukamaju, Ngawi"
    media_urls:
      type: array
      items:
        type: string
    latitude:
      type: number
      example: -7.4045
    longitude:
      type: number
      example: 111.4452

UploadMediaResponse:
  type: object
  properties:
    url:
      type: string
      example: "http://localhost:3900/tandur/listings/user1/uuid.jpg"
    key:
      type: string
      example: "listings/user1/uuid.jpg"
    media_type:
      type: string
      enum: [photo, video]
      example: "photo"
    mime_type:
      type: string
      example: "image/jpeg"
    size_bytes:
      type: integer
      example: 1450000
