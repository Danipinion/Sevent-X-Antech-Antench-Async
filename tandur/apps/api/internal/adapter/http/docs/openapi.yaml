openapi: 3.0.3
info:
  title: TANDUR API
  version: 1.0.0
  description: 'Spesifikasi REST API TANDUR sebagai kontrak komunikasi antara Frontend
    dan Backend. Mendukung operasional rantai pasok komoditas pertanian, agregasi
    stok petani, dan mekanisme kontrol margin harga.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Development Server Local
- url: /api/v1
  description: Traefik Proxy Path
tags:
- name: Autentikasi & Pengguna
  description: Endpoint registrasi akun, autentikasi login (No HP / NIK), informasi
    sesi pengguna (/auth/me), dan pencabutan sesi (logout).
- name: Pantauan Harga & Komoditas
  description: Katalog komoditas pangan, pantauan harga pasar riil (dashboard realtime
    update 10 menit), panduan batas margin harga jual, dan acuan harga SP2KP Kemendag.
- name: Verifikasi Kemitraan Petani
  description: Pemeriksaan status verifikasi identitas petani dan pengajuan dokumen
    e-KTP terenkripsi AES-256-GCM ke Garage S3 untuk membuka kuota jual panen.
- name: Penjualan Panen Petani
  description: Manajemen listing hasil panen milik petani yang siap ditransaksikan
    ke pembeli/tengkulak, diproteksi guard verifikasi kemitraan.
- name: Sistem & Pemantauan
  description: Pemeriksaan kesehatan sistem (healthcheck), konektivitas database PostgreSQL
    + PostGIS, dan cache Redis.
paths:
  /health:
    get:
      tags:
      - Sistem & Pemantauan
      summary: Healthcheck Status Server
      description: Memeriksa ketersediaan API backend dan koneksi database.
      responses:
        '200':
          description: Server beroperasi normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Server beroperasi normal
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                        example: tandur-api
                      version:
                        type: string
                        example: v1.0.0
                      database:
                        type: string
                        example: connected
                      timestamp:
                        type: string
                        example: '2026-11-21T09:30:00Z'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /commodities:
    get:
      tags:
      - Pantauan Harga & Komoditas
      summary: Daftar Seluruh Komoditas
      description: Mengambil daftar komoditas pertanian beserta acuan harga dasar
        dan harga pasar.
      responses:
        '200':
          description: Berhasil mengambil daftar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Daftar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commodity'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /commodities/realtime-prices:
    get:
      tags:
      - Pantauan Harga & Komoditas
      summary: Pantauan Harga Pasar Riil Komoditas (Dashboard Petani)
      description: 'Mengambil pantauan harga pasar riil komoditas pertanian (Gabah
        Kering Panen, GKG, Jagung Pipil, Kedelai Lokal) yang diperbarui setiap 10
        menit sekali dengan perhitungan selisih/delta harian (Hari ini vs Kemarin).

        '
      parameters:
      - name: kode_provinsi
        in: query
        description: Kode BPS Provinsi (contoh 35 untuk Jawa Timur).
        required: false
        schema:
          type: string
          example: '35'
      - name: kode_kab_kota
        in: query
        description: Kode BPS Kabupaten/Kota (contoh 3519 untuk Kabupaten Madiun).
        required: false
        schema:
          type: string
          example: '3519'
      responses:
        '200':
          description: Berhasil mengambil pantauan harga pasar riil komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Pantauan harga pasar riil komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashboardCommodityPrice'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /commodities/price-guide:
    get:
      tags:
      - Pantauan Harga & Komoditas
      summary: Panduan Batas Margin Harga Jual Panen
      description: "Mengambil rekomendasi batas harga jual terendah dan tertinggi\
        \ (toleransi \xB115%) berdasarkan harga pasar riil untuk komoditas tertentu.\n"
      parameters:
      - name: commodity_name
        in: query
        description: Nama komoditas (contoh "Cabai Merah Keriting", "Gabah Kering
          Panen")
        required: true
        schema:
          type: string
          example: Gabah Kering Panen
      - name: kode_provinsi
        in: query
        description: Kode BPS Provinsi
        required: false
        schema:
          type: string
          example: '35'
      - name: kode_kab_kota
        in: query
        description: Kode BPS Kabupaten/Kota
        required: false
        schema:
          type: string
          example: '3519'
      responses:
        '200':
          description: Panduan batas rentang harga berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Panduan rentang harga komoditas berhasil diambil
                  data:
                    $ref: '#/components/schemas/PriceGuide'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /commodities/market-prices:
    get:
      tags:
      - Pantauan Harga & Komoditas
      summary: Harga Pasar Komoditas Terbaru (SP2KP Kemendag)
      description: 'Mengambil data perbandingan harga komoditas pangan dan pertanian
        dari SP2KP Kemendag RI secara nasional atau spesifik wilayah BPS (berdasarkan
        kode provinsi dan kode kabupaten/kota).

        '
      parameters:
      - name: tanggal
        in: query
        description: Tanggal acuan harga (format YYYY-MM-DD). Default hari ini / hari
          kerja terakhir.
        required: false
        schema:
          type: string
          example: '2026-11-20'
      - name: tanggal_pembanding
        in: query
        description: Tanggal pembanding untuk menghitung selisih harga (format YYYY-MM-DD).
          Default H-1.
        required: false
        schema:
          type: string
          example: '2026-11-19'
      - name: kode_provinsi
        in: query
        description: Kode BPS Provinsi (contoh 35 untuk Jawa Timur). Kosongkan untuk
          harga nasional.
        required: false
        schema:
          type: string
          example: '35'
      - name: kode_kab_kota
        in: query
        description: Kode BPS Kabupaten/Kota (contoh 3519 untuk Kabupaten Madiun).
        required: false
        schema:
          type: string
          example: '3519'
      responses:
        '200':
          description: Berhasil mengambil data harga pasar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Harga pasar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SP2KPCommodityPrice'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '500':
          description: Gagal mengambil data harga pasar SP2KP Kemendag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Pantauan Harga & Komoditas
      summary: Query Harga Pasar Komoditas (SP2KP Kemendag)
      description: Mengambil data perbandingan harga komoditas melalui JSON payload
        body atau Form parameters.
      parameters:
      - name: tanggal
        in: query
        description: Tanggal acuan harga (opsional lewat query)
        required: false
        schema:
          type: string
          example: '2026-11-20'
      - name: tanggal_pembanding
        in: query
        description: Tanggal pembanding (opsional lewat query)
        required: false
        schema:
          type: string
          example: '2026-11-19'
      - name: kode_provinsi
        in: query
        description: Kode BPS Provinsi (opsional lewat query)
        required: false
        schema:
          type: string
          example: '35'
      - name: kode_kab_kota
        in: query
        description: Kode BPS Kabupaten/Kota (opsional lewat query)
        required: false
        schema:
          type: string
          example: '3519'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tanggal:
                  type: string
                  example: '2026-11-20'
                tanggal_pembanding:
                  type: string
                  example: '2026-11-19'
                kode_provinsi:
                  type: string
                  example: '35'
                kode_kab_kota:
                  type: string
                  example: '3519'
      responses:
        '200':
          description: Berhasil mengambil data harga pasar komoditas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Harga pasar komoditas berhasil diambil
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SP2KPCommodityPrice'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '500':
          description: Gagal mengambil data harga pasar SP2KP Kemendag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /commodities/{id}:
    get:
      tags:
      - Pantauan Harga & Komoditas
      summary: Detail Komoditas
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detail komoditas ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Detail komoditas berhasil diambil
                  data:
                    $ref: '#/components/schemas/Commodity'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Komoditas tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags:
      - Autentikasi & Pengguna
      summary: Registrasi Akun Pengguna Baru
      description: 'Mendaftarkan akun baru (farmer, middleman, atau buyer) beserta
        informasi lokasi opsional. Anda dapat mengisi langsung melalui Form Input
        di bagian **Parameters** di bawah ini, atau memilih contoh JSON melalui **Request
        body**.

        '
      parameters:
      - name: name
        in: query
        description: Nama lengkap pengguna (Wajib)
        required: false
        schema:
          type: string
          example: Pak Joko Tani
      - name: phone
        in: query
        description: Nomor Handphone 10-13 digit (Wajib)
        required: false
        schema:
          type: string
          example: 081234567890
      - name: password
        in: query
        description: Password minimal 6 karakter (Wajib)
        required: false
        schema:
          type: string
          format: password
          example: rahasia123
      - name: role
        in: query
        description: Peran akun dalam sistem (Wajib)
        required: false
        schema:
          type: string
          enum:
          - farmer
          - middleman
          - buyer
          example: farmer
      - name: nik
        in: query
        description: NIK KTP 16 digit angka (Opsional)
        required: false
        schema:
          type: string
          example: '3201010101010077'
      - name: is_bisnis
        in: query
        description: Apakah akun bisnis / perusahaan
        required: false
        schema:
          type: boolean
          default: false
          example: false
      - name: address
        in: query
        description: Alamat lokasi kebun / gudang / toko (Opsional)
        required: false
        schema:
          type: string
          example: Jl. Pertanian Makmur No. 20
      - name: latitude
        in: query
        description: Titik koordinat Latitude (Opsional)
        required: false
        schema:
          type: number
          format: double
          example: -6.7456
      - name: longitude
        in: query
        description: Titik koordinat Longitude (Opsional)
        required: false
        schema:
          type: number
          format: double
          example: 107.0872
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              petani_lengkap:
                summary: "\U0001F9D1\u200D\U0001F33E 1. Petani (Lengkap dengan Koordinat\
                  \ Kebun)"
                value:
                  nik: '3201010101010099'
                  name: Pak Slamet Petani
                  phone: 081399998888
                  password: secretPassword123
                  role: farmer
                  is_bisnis: false
                  location:
                    label: Kebun Cabai Utama
                    address: Jl. Raya Pertanian No. 12
                    village: Cikanyere
                    district: Sukaresmi
                    city: Kabupaten Cianjur
                    province: Jawa Barat
                    latitude: -6.7456
                    longitude: 107.0872
              tengkulak_bisnis:
                summary: "\U0001F3E2 2. Tengkulak (Akun Bisnis + Gudang)"
                value:
                  nik: '3201010101010088'
                  name: CV Tani Berkah Bersama
                  phone: 081288887777
                  password: secretPassword123
                  role: middleman
                  is_bisnis: true
                  location:
                    label: Gudang Konsolidasi
                    address: Jl. Pergudangan Agrobisnis No. 8
                    village: Sukamaju
                    district: Cianjur
                    city: Kabupaten Cianjur
                    province: Jawa Barat
                    latitude: -6.8173
                    longitude: 107.1394
              pembeli_individu:
                summary: "\U0001F6D2 3. Pembeli (Simple tanpa Lokasi)"
                value:
                  name: Resto Padang Sejahtera
                  phone: 081177776666
                  password: secretPassword123
                  role: buyer
                  is_bisnis: false
      responses:
        '201':
          description: Berhasil mendaftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Registrasi akun berhasil
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Data masukan tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Nomor handphone atau NIK sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
      - Autentikasi & Pengguna
      summary: Login Pengguna
      description: 'Autentikasi pengguna menggunakan Nomor Handphone atau NIK sebagai
        username dan password. Mengembalikan token sesi berbasis JWT (JSON Web Token)
        yang digunakan untuk otorisasi endpoint terlindungi. Anda dapat mengisi langsung
        melalui Form Input di bagian **Parameters** di bawah ini, atau mengirim JSON
        payload melalui **Request body**.

        '
      parameters:
      - name: username
        in: query
        description: Nomor Handphone (10-13 digit) atau NIK (16 digit angka)
        required: false
        schema:
          type: string
          example: 081399998888
      - name: password
        in: query
        description: Password akun pengguna
        required: false
        schema:
          type: string
          format: password
          example: secretPassword123
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login_phone:
                summary: "\U0001F4F1 1. Login menggunakan Nomor Handphone"
                value:
                  username: 081399998888
                  password: secretPassword123
              login_nik:
                summary: "\U0001FAAA 2. Login menggunakan NIK KTP"
                value:
                  username: '3201010101010099'
                  password: secretPassword123
      responses:
        '200':
          description: Login berhasil, token JWT diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    $ref: '#/components/schemas/LoginResponseData'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Username atau password tidak diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Kredensial tidak valid (Nomor HP/NIK atau password salah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Akun tidak aktif atau dinonaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
      - Autentikasi & Pengguna
      summary: Profil Pengguna Aktif (Sesi JWT)
      description: Mengambil data profil pengguna yang saat ini sedang login berdasarkan
        token JWT di header Authorization.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profil pengguna berhasil diambil
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Token otorisasi tidak valid atau telah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
      - Autentikasi & Pengguna
      summary: Logout Pengguna
      description: 'Mengakhiri sesi pengguna aktif dan memasukkan token JWT ke dalam
        daftar hitam (blacklist) sehingga token tersebut tidak dapat digunakan lagi
        untuk otorisasi.

        '
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logout berhasil
                  data:
                    nullable: true
                    example: null
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Token otorisasi tidak valid, telah kedaluwarsa, atau sudah
            dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /farmer/verification:
    get:
      tags:
      - Verifikasi Kemitraan Petani
      summary: Status Verifikasi Kemitraan Petani
      description: Memeriksa status verifikasi identitas e-KTP petani, hasil pembacaan
        OCR, dan hak jual panen.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Status verifikasi petani berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Status verifikasi kemitraan petani
                  data:
                    $ref: '#/components/schemas/FarmerVerificationResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Belum terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Verifikasi Kemitraan Petani
      summary: Kirim Dokumen Verifikasi e-KTP Petani
      description: Mengunggah berkas foto e-KTP asli dan data kependudukan hasil pembacaan
        OCR untuk mengaktifkan status kemitraan resmi dan membuka kuota jual panen.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerVerificationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmerVerificationInput'
      responses:
        '200':
          description: Dokumen e-KTP berhasil diverifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Dokumen e-KTP berhasil diverifikasi. Kemitraan resmi
                      aktif dan Anda dapat mulai menjual hasil panen.
                  data:
                    $ref: '#/components/schemas/FarmerVerificationResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Validasi gagal (NIK tidak valid, foto KTP kosong, atau pernyataan
            belum disetujui)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Hanya akun dengan role petani yang dapat melakukan verifikasi
            kemitraan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: NIK sudah digunakan oleh akun lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /farmer/listings:
    get:
      tags:
      - Penjualan Panen Petani
      summary: Daftar Hasil Panen Petani (Berpaginasi)
      description: Mengambil seluruh riwayat dan daftar hasil panen yang didaftarkan
        oleh petani dengan dukungan pagination dan filter status.
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        description: Nomor halaman (default 1)
        required: false
        schema:
          type: integer
          default: 1
          example: 1
      - name: limit
        in: query
        description: Jumlah data per halaman (default 10, maksimal 100)
        required: false
        schema:
          type: integer
          default: 10
          example: 10
      - name: status
        in: query
        description: Filter status listing (all, draft, published, reserved, completed,
          cancelled)
        required: false
        schema:
          type: string
          example: published
      - name: commodity_id
        in: query
        description: Filter berdasarkan UUID komoditas
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Daftar panen berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FarmerListing'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags:
      - Penjualan Panen Petani
      summary: Jual Hasil Panen (Daftarkan Listing Panen)
      description: 'Mendaftarkan komoditas panen untuk dijual. Petani WAJIB berstatus
        terverifikasi (e-KTP diverifikasi). Wajib menyertakan minimal 1 foto sampel
        panen, maksimal 1 video opsional (total maksimal 5 berkas media), dan bobot
        panen minimal 500 kg.

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingInput'
      responses:
        '201':
          description: Hasil panen berhasil didaftarkan untuk dijual
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FarmerListing'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Validasi gagal (bobot kurang dari 500 kg atau aturan komposisi
            media tidak dipenuhi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Petani belum terverifikasi (FARMER_NOT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /farmer/listings/{id}:
    get:
      tags:
      - Penjualan Panen Petani
      summary: Detail Listing Panen
      description: Mengambil data rinci satu listing penjualan panen milik petani.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        description: ID unik listing panen
        required: true
        schema:
          type: string
          example: 9e81b672-0e24-419b-a320-b6f790c68123
      responses:
        '200':
          description: Detail listing panen ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FarmerListing'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Listing panen tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Penjualan Panen Petani
      summary: Update Data Jual Panen
      description: Memperbarui informasi listing panen (harga, bobot, tanggal siap
        muat, foto sampel). Hanya dapat dilakukan saat status masih draft atau published.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        description: ID unik listing panen
        required: true
        schema:
          type: string
          example: 9e81b672-0e24-419b-a320-b6f790c68123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingInput'
      responses:
        '200':
          description: Data panen berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FarmerListing'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '409':
          description: Listing sudah terkunci / disepakati dengan tengkulak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Penjualan Panen Petani
      summary: Batalkan / Hapus Listing Panen (Soft Delete)
      description: Membatalkan listing panen yang belum bertransaksi. Status listing
        diubah menjadi 'cancelled' dan dicatat waktu penghapusannya.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        description: ID unik listing panen
        required: true
        schema:
          type: string
          example: 9e81b672-0e24-419b-a320-b6f790c68123
      responses:
        '200':
          description: Listing panen berhasil dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    nullable: true
                    example: null
                  meta:
                    $ref: '#/components/schemas/Meta'
  /farmer/listings/upload-media:
    post:
      tags:
      - Penjualan Panen Petani
      summary: Upload Berkas Media Sampel Panen (Foto / Video)
      description: 'Mengunggah berkas media sampel panen ke Garage Object Storage
        (S3 publik). Divalidasi ketat dengan inspeksi magic bytes biner, anti-polyglot,
        dan pencegahan double extension. Foto maksimal 5 MB (JPG, PNG, WebP), Video
        maksimal 25 MB (MP4, MOV, WebM).

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - media
              properties:
                media:
                  type: string
                  format: binary
                  description: Berkas foto (JPG/PNG/WebP maks 5MB) atau video (MP4/MOV/WebM
                    maks 25MB)
      responses:
        '201':
          description: Berkas media berhasil diunggah dan diverifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UploadMediaResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Berkas tidak valid (magic bytes mismatch, melebihi batas ukuran,
            atau terdeteksi skrip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
