services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      network: host
    container_name: tandur-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tandur-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: tandur-api
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./apps/api:/app
      - ./database/migrations:/migrations:ro
      - go_modules:/go/pkg/mod
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}/0
      S3_ENDPOINT: http://127.0.0.1:${GARAGE_S3_PORT:-3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-tandur}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-tandur-secret-key-super-secure-change-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-72}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgis/postgis:17-3.5
    container_name: tandur-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tandur-network

  redis:
    image: redis:7-alpine
    container_name: tandur-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tandur-network

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: tandur-garage
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_WEB_PORT:-3902}:3902"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test:
        - CMD
        - /garage
        - status
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - tandur-network

  filestash:
    image: machines/filestash:latest
    container_name: tandur-filestash
    restart: unless-stopped
    ports:
      - "${FILESTASH_PORT:-8334}:8334"
    volumes:
      - filestash_data:/app/data/state
    depends_on:
      - garage
    networks:
      - tandur-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tandur-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tandur.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tandur-network

  nginx:
    image: nginx:alpine
    container_name: tandur-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  garage_data:
  garage_meta:
  filestash_data:
  pgadmin_data:
  web_node_modules:
  go_modules:

networks:
  tandur-network:
    driver: bridge
